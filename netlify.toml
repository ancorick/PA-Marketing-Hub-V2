# Netlify: deploys only frontend/ (React SPA). Backend lives on Render (render.yaml = demo API).
# Set VITE_API_URL (the Render URL of the API) in Netlify → Site configuration → Environment variables.
# This repository is the public DEMO: VITE_DEMO_MODE shows the "Demo · synthetic data" mark and the Dev inbox.
# Remove it for the real site.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_DEMO_MODE = "true"

# SPA: every route is served by index.html; the client router handles it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
