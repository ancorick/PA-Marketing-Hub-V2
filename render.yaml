# DEMO Render Blueprint: the public demo of Marketing Hub with synthetic data only (DEMO_MODE).
# The real site uses render.production.yaml with its own database and without DEMO_* or mock sign-in.
#
# Deploys only backend/ (Fastify API); the frontend lives on Netlify (netlify.toml).
# Database: a Neon Postgres project used ONLY for this demo (free, Frankfurt). On the first start the API loads
# the synthetic data set into it (about 1,800 made-up contacts, campaigns, newsletter, events, costs). The seed
# only ever writes into a database without contacts, so it skips on later starts and never touches real data.
#
# Free plan: the service sleeps after 15 min without traffic and takes about a minute to wake up.

services:
  - type: web
    name: marketing-hub-demo-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    # --include=dev: TypeScript and build tools are devDependencies; NODE_ENV=production would skip them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Emails are never sent: they are written to the log and shown on the Dev inbox page.
      - key: EMAIL_ADAPTER
        value: log
      - key: INTEGRATIONS_MODE
        value: mock
      # Demo deploy: synthetic data on the first start, Dev inbox on.
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SEED
        value: "true"
      # Anyone can pick a role in the sidebar (mock sign-in). Acceptable only because all data is synthetic.
      - key: ALLOW_MOCK_SIGN_IN
        value: "true"
      # Netlify site URL of the demo, e.g. https://<site>.netlify.app (comma-separated if several).
      - key: CORS_ORIGINS
        sync: false
      # Same Netlify URL: public unsubscribe and preferences pages live there.
      - key: PUBLIC_APP_URL
        sync: false
      # Connection string of the demo Neon database (with sslmode=require). Never the real database.
      - key: DATABASE_URL
        sync: false
      # Signing secrets and keys, generated once by Render. PUBLIC_API_URL defaults to this service's own URL.
      - key: LINK_SIGNING_SECRET
        generateValue: true
      - key: ESP_WEBHOOK_SECRET
        generateValue: true
      - key: EVENT_HUB_WEBHOOK_SECRET
        generateValue: true
      - key: EVENT_HUB_SANDBOX_SECRET
        generateValue: true
      - key: EVENT_HUB_API_KEY
        generateValue: true
      - key: COMMAND_CENTER_API_KEY
        generateValue: true
