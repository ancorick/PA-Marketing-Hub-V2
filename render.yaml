# Render Blueprint: deploys only backend/ (Fastify API). Frontend lives on Netlify (netlify.toml).
# Database: Neon Postgres (free, Frankfurt), not Render Postgres; DATABASE_URL is entered in the dashboard.
#
# Free plan limits (development only): the service sleeps after 15 min without traffic and takes
# ~1 min to wake. Before the first real send move to an always-on plan (PRD 14.4: unsubscribe 99.9%,
# webhooks < 1 min, scheduled sends and the nightly pipeline need a service that does not sleep).

services:
  - type: web
    name: marketing-hub-api
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    # --include=dev: TypeScript and build tools are devDependencies; NODE_ENV=production would skip them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: EMAIL_ADAPTER
        value: log
      - key: INTEGRATIONS_MODE
        value: mock
      # Mock staff tokens ("mock-admin" etc.) are public: keep them off on the deployed API.
      # Staff screens answer 401 until Core Engine sign-in exists (manual task 7). Turning this on
      # for a demo lets anyone on the internet act as admin.
      - key: ALLOW_MOCK_SIGN_IN
        value: "false"
      # Netlify site URL(s), comma-separated, e.g. https://<site>.netlify.app
      - key: CORS_ORIGINS
        sync: false
      # Neon connection string with sslmode=require
      - key: DATABASE_URL
        sync: false
      # Signs unsubscribe and preferences links (NFR-S5). Generated once by Render; never rotate casually,
      # links already sent would stop working.
      - key: LINK_SIGNING_SECRET
        generateValue: true
      # Netlify site URL (public unsubscribe/preferences pages) and this service's own HTTPS URL.
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false

  # Nightly analytics pipeline (PRD 9.2, NFR-F6, 07:00 Yerevan = 03:00 UTC) is added in phase 3
  # as a cron service (cron jobs are paid on Render), for example:
  # - type: cron
  #   name: marketing-hub-etl
  #   runtime: node
  #   rootDir: backend
  #   schedule: "0 3 * * *"
  #   buildCommand: npm ci --include=dev && npm run build
  #   startCommand: node dist/jobs/nightly-pipeline.js
